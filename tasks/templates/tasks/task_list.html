<h1>My Tasks</h1>

<form method="post" action="{% url 'create-task' %}">
  {% csrf_token %}
  <input type="text" name="title" placeholder="New task title" required>
  <button type="submit">Add</button>
</form>

{% if tasks %}
  <ul>
    {% for task in tasks %}
      <li>
        <form method="post" action="{% url 'update-task' task.id %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit">{% if task.completed %}Unmark{% else %}Mark{% endif %}</button>
        </form>
        {{ task.title }} - 
        {% if task.completed %} ✔ {% else %} ❌ {% endif %}
        <form method="post" action="{% url 'delete-task' task.id %}" style="display:inline; margin-left:8px;">
          {% csrf_token %}
          <button type="submit">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>No tasks yet 👀</p>
{% endif %}
